<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Sample computed 7-iron tracer over a plain fairway gradient">
  <title>TrAIcer sample overlay — computed 7-iron flight</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#061018"/>
      <stop offset="55%" stop-color="#0A1C30"/>
      <stop offset="78%" stop-color="#123044"/>
      <stop offset="100%" stop-color="#15281C"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A3320"/>
      <stop offset="45%" stop-color="#102018"/>
      <stop offset="100%" stop-color="#071526"/>
    </linearGradient>
    <radialGradient id="sun" cx="78%" cy="28%" r="35%">
      <stop offset="0%" stop-color="#1A3348" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#071526" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ball" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#AFF1FC"/>
      <stop offset="70%" stop-color="#1AD6F5"/>
      <stop offset="100%" stop-color="#13A1B8"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- Placeholder 'video still' — gradients only, no photography -->
  <rect width="1280" height="720" fill="url(#sky)"/>
  <circle cx="1000" cy="200" r="260" fill="url(#sun)"/>
  <!-- horizon / fairway, abstract -->
  <path d="M0,470 C280,440 520,455 760,448 C980,442 1140,458 1280,450 L1280,720 L0,720 Z" fill="url(#ground)"/>
  <path d="M0,470 C280,440 520,455 760,448 C980,442 1140,458 1280,450" fill="none" stroke="#1A3348" stroke-width="2"/>
  <!-- a few abstract distance bands, not a drawing of a hole -->
  <path d="M0,520 C400,500 800,515 1280,505" fill="none" stroke="#0C1E34" stroke-width="18" stroke-opacity=".5"/>
  <path d="M0,590 C400,575 800,595 1280,580" fill="none" stroke="#0A1820" stroke-width="28" stroke-opacity=".4"/>

